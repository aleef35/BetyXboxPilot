name: Diagnose GameGrid file API
on:
  push:
    branches:
      - cvg-pal-control-android-20261105
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Read public OpenAPI routes for file bridge
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          u='https://wdcgamegrid.com/api/public/v1/openapi.json'
          with urllib.request.urlopen(u,timeout=25) as s:
            d=json.load(s)
          for p, ops in d.get('paths',{}).items():
            if '/files' in p and 'server' in p:
              print('ROUTE',p)
              for method, spec in ops.items():
                if method.upper() not in ('GET','POST','PUT','PATCH','DELETE'):continue
                print('  ',method.upper(),spec.get('operationId',''))
                if 'requestBody' in spec:
                  print('  BODY',json.dumps(spec['requestBody'],ensure_ascii=False)[:700])
                if 'parameters' in spec:
                  print('  PARAM',json.dumps(spec['parameters'],ensure_ascii=False)[:700])
          PY
