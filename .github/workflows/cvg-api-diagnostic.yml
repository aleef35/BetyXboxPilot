name: Diagnose GameGrid file API
on:
  push:
    branches: [cvg-pal-control-android-20261105]
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Check official account key routes
        run: |
          python3 - <<'PY'
          import urllib.request,json
          with urllib.request.urlopen('https://wdcgamegrid.com/api/public/v1/openapi.json',timeout=25) as s:
            d=json.load(s)
          for p, ops in d.get('paths',{}).items():
            if 'key' in p.lower() or p.endswith('/servers') or p.startswith('/account'):
              print('ROUTE',p,'methods',','.join(k.upper() for k in ops if k in ('get','post','put','delete','patch')))
          PY
