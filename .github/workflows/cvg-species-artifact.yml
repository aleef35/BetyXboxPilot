name: Package CVG Pal species catalog
on:
  push:
    branches: [cvg-pal-control-android-20261105]
    paths: [.github/workflows/cvg-species-artifact.yml]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source catalog
        run: |
          python3 - <<'PY'
          import csv
          with open('cvg_palworld_v1_0_5_species.csv',encoding='utf8') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==333
          assert sum(bool(r['codename'] and r['slug'] and r['displayName']) for r in rows)==308
          print('Validated 333 rows, 308 named Pals')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cvg-palworld-species-csv
          path: cvg_palworld_v1_0_5_species.csv
          retention-days: 7
