name: Build CVG Pal Control Android APK
on:
  push:
    branches:
      - cvg-pal-control-android-20261105
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirmar SDK Android do runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
            sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Extrair CVG Pal Control
        run: unzip -q cvg-pal-control-source.zip
      - name: Aplicar contrato oficial de arquivos GameGrid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CVG_Pal_Control_Android_Source/app/src/main/java/br/com/corvogames/palcontrol/GameGridFiles.java')
          s=p.read_text(encoding='utf-8')
          before_read='"/files/read?path="'
          before_write='request("POST","/servers/"+SERVER+"/files/write",payload)'
          assert before_read in s, 'read endpoint missing'
          assert before_write in s, 'write endpoint missing'
          s=s.replace(before_read,'"/files/content?path="')
          s=s.replace(before_write,'request("PUT","/servers/"+SERVER+"/files/content",payload)')
          p.write_text(s,encoding='utf-8')
          print('Endpoint GameGrid verificado: GET e PUT /servers/{serverId}/files/content')
          PY
      - name: Corrigir resolução do servidor GameGrid e versão 1.1
        run: python3 cvg_pal_control_v11_patch.py
      - name: Compilar APK debug
        working-directory: CVG_Pal_Control_Android_Source
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar assinatura e pacote Android
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose CVG_Pal_Control_Android_Source/app/build/outputs/apk/debug/app-debug.apk
      - name: Criar arquivo APK direto no GitHub (ramificação isolada)
        run: |
          cp CVG_Pal_Control_Android_Source/app/build/outputs/apk/debug/app-debug.apk CVG_Pal_Control_v1_1_Android_Instalar.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CVG_Pal_Control_v1_1_Android_Instalar.apk
          git commit -m "build: publish standalone signed CVG Pal Control v1.1 APK" || true
          git push origin HEAD:cvg-pal-control-android-20261105
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CVG-Pal-Control-v1.1-APK
          path: CVG_Pal_Control_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
