name: Build CVG Pal Control Android APK
on:
  push:
    branches:
      - cvg-pal-control-android-20261105
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK Android 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extrair CVG Pal Control
        run: unzip -q cvg-pal-control-source.zip
      - name: Compilar APK debug
        working-directory: CVG_Pal_Control_Android_Source
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CVG-Pal-Control-Experimental-APK
          path: CVG_Pal_Control_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
