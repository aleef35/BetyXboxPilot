name: Build BetyXboxPilot APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "BetyXboxPilot-source-v0.2.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Extrair codigo
        run: unzip -o BetyXboxPilot-source-v0.2.zip
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Gerar APK
        working-directory: BetyXboxPilot
        run: gradle assembleDebug --stacktrace
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: BetyXboxPilot-APK
          path: BetyXboxPilot/app/build/outputs/apk/debug/app-debug.apk
