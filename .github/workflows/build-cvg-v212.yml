name: Build CVG GameGrid Android 2.12
on:
  push:
    branches: [cvg-gamegrid-v212-copiar-id]
  pull_request:
    branches: [main]
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK platform/build tools
        run: |
          SDKMGR=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          printf 'Using %s\\n' "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restaurar fontes
        run: |
          mkdir -p cvg-v212/source
          cat cvg-v212/build/part0{0,1,2,3,4}.txt | base64 -d > cvg-v212/cvg-gamegrid-source.zip
          unzip -q cvg-v212/cvg-gamegrid-source.zip -d cvg-v212/source
      - name: Testes de regressão
        run: |
          cd cvg-v212/source
          python3 tests/test_v2_12_copy_id.py
          python3 tests/test_v2_10_passivas.py
          python3 tests/test_v2_9_integrity.py
      - name: Compilar APK instalável
        run: |
          cd cvg-v212/source
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CVG_GameGrid_Android_v2_12_Copiar_ID_APK
          path: cvg-v212/source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
